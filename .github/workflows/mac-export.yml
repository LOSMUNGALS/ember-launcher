name: Export Ember for Mac
on:
  workflow_dispatch:
  push:
    branches: [codex/initial-import]
    paths: [.github/workflows/mac-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:accounts
      - run: npm run package:mac -- --publish never
      - run: npm run smoke
      - name: Check exported app
        run: |
          test -f release/Ember-1.0.0-arm64-mac.zip
          unzip -t release/Ember-1.0.0-arm64-mac.zip
          file release/mac-arm64/Ember.app/Contents/MacOS/Ember
          shasum -a 256 release/Ember-1.0.0-arm64-mac.zip > release/SHA256-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-1.0.0-Mac-Apple-Silicon
          path: |
            release/Ember-1.0.0-arm64-mac.zip
            release/SHA256-mac.txt
          if-no-files-found: error
          retention-days: 30
