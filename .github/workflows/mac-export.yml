name: Export Ember for Mac
on:
  workflow_dispatch:
  push:
    branches: [codex/initial-import]
    paths: [.github/workflows/mac-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix server
      - run: npm --prefix server test
      - run: npm run package:mac -- --publish never
      - run: npm run smoke
      - name: Read version
        id: version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version='+require('./package.json').version+'\n')"
      - name: Check exported app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "release/Ember-${VERSION}-arm64-mac.zip"
          unzip -t "release/Ember-${VERSION}-arm64-mac.zip"
          file release/mac-arm64/Ember.app/Contents/MacOS/Ember
          shasum -a 256 "release/Ember-${VERSION}-arm64-mac.zip" > release/SHA256-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-${{ steps.version.outputs.version }}-Mac-Apple-Silicon
          path: |
            release/Ember-*-arm64-mac.zip
            release/SHA256-mac.txt
          if-no-files-found: error
          retention-days: 30
