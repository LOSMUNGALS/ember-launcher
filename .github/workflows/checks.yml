name: Ember checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:accounts
      - run: npm ci --prefix server --ignore-scripts
      - run: node scripts/generate-async-accounts.mjs
      - run: git diff --exit-code -- server/async-service.mjs
      - run: npm --prefix server test
      - run: npm run build
