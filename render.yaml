services:
  - type: web
    name: ember-accounts
    runtime: docker
    branch: codex/initial-import
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EMBER_ADMIN_EMAIL
        value: nicolas2mv@gmail.com
      - key: PUBLIC_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
