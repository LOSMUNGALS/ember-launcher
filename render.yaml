services:
  - type: web
    name: ember-accounts
    runtime: docker
    branch: codex/initial-import
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EMBER_ADMIN_EMAIL
        value: nicolas2mv@gmail.com
      - key: PUBLIC_URL
        sync: false
    disk:
      name: ember-accounts-data
      mountPath: /app/.account-service
      sizeGB: 1
